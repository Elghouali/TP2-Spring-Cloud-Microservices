server:
  port: 8080
spring:
  application:
    name: gateway-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
---
spring:
  config:
    activate:
      on-profile: static
  cloud:
    gateway:
      routes:
        - id: customers-static
          uri: http://localhost:8081
          predicates:
            - Path=/api/customers,/api/customers/**
        - id: products-static
          uri: http://localhost:8082
          predicates:
            - Path=/api/products,/api/products/**
        - id: bills-static
          uri: http://localhost:8083
          predicates:
            - Path=/api/bills,/api/bills/**
---
spring:
  config:
    activate:
      on-profile: dynamic
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: customers-eureka
          uri: lb://customer-service
          predicates:
            - Path=/api/customers,/api/customers/**
        - id: products-eureka
          uri: lb://inventory-service
          predicates:
            - Path=/api/products,/api/products/**
        - id: bills-eureka
          uri: lb://billing-service
          predicates:
            - Path=/api/bills,/api/bills/**
